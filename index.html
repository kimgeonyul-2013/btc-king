<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bitcoin Testnet4 Wallet API</title>
  <style>
    * { box-sizing: border-box; border-radius: 0 !important; }
    body {
      background-color: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      margin: 0;
      padding: 24px;
      line-height: 1.5;
    }
    .container { max-width: 760px; margin: 0 auto; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 2px solid #000000;
      padding-bottom: 10px;
      margin-bottom: 24px;
    }
    h1 { font-size: 1.25rem; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
    .status { font-size: 0.85rem; font-family: monospace; color: #333333; }
    .section {
      border: 1px solid #cccccc;
      padding: 20px;
      margin-bottom: 20px;
      background-color: #ffffff;
    }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 8px;
      margin-bottom: 14px;
    }
    h2 { font-size: 1rem; font-weight: 700; margin: 0; }
    label { display: block; font-size: 0.85rem; color: #444444; margin-bottom: 6px; }
    input {
      width: 100%;
      background-color: #ffffff;
      border: 1px solid #000000;
      color: #000000;
      padding: 10px 12px;
      font-size: 0.92rem;
      font-family: monospace;
      outline: none;
    }
    input:focus { background-color: #f9f9f9; }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    button {
      background-color: #ffffff;
      color: #000000;
      border: 1px solid #000000;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background-color: #000000; color: #ffffff; }
    button.primary { background-color: #000000; color: #ffffff; }
    button.primary:hover { background-color: #333333; }
    .balance-main {
      font-size: 2rem;
      font-weight: 700;
      font-family: monospace;
      color: #000000;
      margin: 8px 0;
    }
    .meta-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.88rem;
    }
    .meta-table td {
      padding: 6px 0;
      border-top: 1px solid #eeeeee;
    }
    .meta-table td.val {
      text-align: right;
      font-family: monospace;
      font-weight: 600;
    }
    .tx-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .tx-table th {
      text-align: left;
      border-bottom: 1px solid #000000;
      padding: 8px 4px;
      font-weight: 700;
    }
    .tx-table td {
      border-bottom: 1px solid #e5e5e5;
      padding: 8px 4px;
      font-family: monospace;
    }
    .tx-table a { color: #000000; text-decoration: underline; }
    .empty-msg { font-size: 0.85rem; color: #666666; padding: 12px 0; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>BITCOIN TESTNET4 WALLET</h1>
    <span class="status" id="apiStatus">STATUS: IDLE</span>
  </header>

  <div class="section">
    <div class="section-header">
      <h2>1. ADDRESS CONFIGURATION</h2>
      <button onclick="checkBalance()">REFRESH</button>
    </div>
    <label for="myAddrInput">Testnet4 Address (tb1q...)</label>
    <input type="text" id="myAddrInput" placeholder="tb1q..." />
    <div class="btn-row">
      <button class="primary" onclick="saveAndCheck()">SAVE & QUERY</button>
      <button onclick="copyMyAddr()">COPY ADDRESS</button>
      <button onclick="window.open('https://mempool.space', '_blank')">OPEN FAUCET</button>
      <button onclick="openExplorer()">EXPLORER</button>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <h2>2. ON-CHAIN BALANCE</h2>
    </div>
    <div class="balance-main"><span id="btcVal">0.00000000</span> tBTC</div>
    <table class="meta-table">
      <tr>
        <td>Total Satoshis</td>
        <td class="val"><span id="totalSat">0</span> sats</td>
      </tr>
      <tr>
        <td>Confirmed Balance</td>
        <td class="val"><span id="confSat">0</span> sats</td>
      </tr>
      <tr>
        <td>Unconfirmed (Mempool)</td>
        <td class="val"><span id="unconfSat">0</span> sats</td>
      </tr>
    </table>
  </div>

  <div class="section">
    <div class="section-header">
      <h2>3. TRANSACTION HISTORY (RECENT 15)</h2>
    </div>
    <div id="txContainer">
      <div class="empty-msg">No address queried.</div>
    </div>
  </div>
</div>

<script>
  const API_BASE = 'https://mempool.space';

  window.onload = () => {
    const saved = localStorage.getItem('my_custom_tbtc4_addr');
    if (saved) {
      document.getElementById('myAddrInput').value = saved;
      checkBalance();
    }
  };

  function saveAndCheck() {
    const addr = document.getElementById('myAddrInput').value.trim();
    if (!addr) return alert('주소를 입력해 주세요.');
    localStorage.setItem('my_custom_tbtc4_addr', addr);
    checkBalance();
  }

  async function checkBalance() {
    const addr = document.getElementById('myAddrInput').value.trim();
    if (!addr) return;

    const statusEl = document.getElementById('apiStatus');
    statusEl.innerText = 'STATUS: QUERYING...';

    try {
      const [tipRes, addrRes, txsRes] = await Promise.all([
        fetch(`${API_BASE}/blocks/tip/height`),
        fetch(`${API_BASE}/address/${addr}`),
        fetch(`${API_BASE}/address/${addr}/txs`)
      ]);

      if (!addrRes.ok) {
        statusEl.innerText = 'STATUS: INVALID ADDRESS';
        alert('올바른 Testnet4 주소인지 확인해 주세요.');
        return;
      }

      const height = await tipRes.text();
      const data = await addrRes.json();
      const txs = await txsRes.json();

      const confirmed = data.chain_stats.funded_txo_sum - data.chain_stats.spent_txo_sum;
      const unconfirmed = data.mempool_stats.funded_txo_sum - data.mempool_stats.spent_txo_sum;
      const total = confirmed + unconfirmed;

      document.getElementById('btcVal').innerText = (total / 100000000).toFixed(8);
      document.getElementById('totalSat').innerText = total.toLocaleString();
      document.getElementById('confSat').innerText = confirmed.toLocaleString();
      document.getElementById('unconfSat').innerText = unconfirmed.toLocaleString();
      statusEl.innerText = `CONNECTED / BLOCK #${Number(height).toLocaleString()}`;

      renderTxTable(txs.slice(0, 15));
    } catch (e) {
      statusEl.innerText = 'STATUS: NETWORK ERROR';
      alert('API 연결에 실패했습니다.');
    }
  }

  function renderTxTable(txs) {
    const container = document.getElementById('txContainer');
    if (!txs || txs.length === 0) {
      container.innerHTML = '<div class="empty-msg">No transactions found for this address.</div>';
      return;
    }

    const rows = txs.map(tx => {
      const status = tx.status.confirmed ? `CONFIRMED (#${tx.status.block_height})` : 'UNCONFIRMED';
      return `
        <tr>
          <td>${status}</td>
          <td><a href="https://mempool.space{tx.txid}" target="_blank">${tx.txid.slice(0, 24)}...</a></td>
          <td>${tx.fee} sats</td>
        </tr>
      `;
    }).join('');

    container.innerHTML = `
      <table class="tx-table">
        <thead>
          <tr>
            <th>STATUS</th>
            <th>TXID</th>
            <th>FEE</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  function copyMyAddr() {
    const addr = document.getElementById('myAddrInput').value.trim();
    if (!addr) return alert('복사할 주소가 없습니다.');
    navigator.clipboard.writeText(addr);
    alert(`Copied: ${addr}`);
  }

  function openExplorer() {
    const addr = document.getElementById('myAddrInput').value.trim();
    if (!addr) return alert('주소를 먼저 입력하세요.');
    window.open(`https://mempool.space{addr}`, '_blank');
  }
</script>
</body>
</html>
