<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리학교 미니 엔트리 - 만들고 공유하는 게임 놀이터</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
        body { margin: 0; background: #f0f4f8; color: #1e293b; }
        header {
            background: #2563eb; color: white; padding: 16px 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        header h1 { margin: 0; font-size: 20px; }
        .nav-btns button {
            background: rgba(255,255,255,0.2); border: none; color: white;
            padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-left: 6px;
        }
        .nav-btns button.active { background: white; color: #2563eb; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 16px; }
        
        /* 작품 카드 목록 */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
        .card {
            background: white; border-radius: 12px; padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); cursor: pointer; transition: 0.2s;
        }
        .card:hover { transform: translateY(-3px); border: 1px solid #2563eb; }
        .card h3 { margin: 0 0 8px 0; font-size: 16px; }
        .card p { margin: 0; font-size: 13px; color: #64748b; }

        /* 게임 실행 화면 & 에디터 */
        .box { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        iframe { width: 100%; height: 360px; border: 2px solid #e2e8f0; border-radius: 8px; background: #fff; }
        textarea {
            width: 100%; height: 200px; padding: 12px; border: 1px solid #cbd5e1;
            border-radius: 8px; font-family: monospace; font-size: 13px; margin: 10px 0;
        }
        input {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1;
            border-radius: 8px; margin-bottom: 10px; font-size: 14px;
        }
        .action-btn {
            background: #10b981; color: white; border: none; padding: 12px 20px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;
        }
        .action-btn.blue { background: #2563eb; }
        .hidden { display: none; }

        /* AADS 광고 배너 영역 */
        .ad-container {
            max-width: 800px; margin: 24px auto; padding: 16px;
            background: white; border-radius: 12px; text-align: center;
            border: 1px dashed #cbd5e1; color: #64748b; font-size: 13px;
        }
    </style>
</head>
<body>

<header>
    <h1>🚀 우리학교 미니 엔트리</h1>
    <div class="nav-btns">
        <button id="tabPlay" class="active" onclick="switchTab('play')">🎮 작품 구경하기</button>
        <button id="tabMake" onclick="switchTab('make')">🛠️ 작품 만들기</button>
    </div>
</header>

<div class="container">
    <!-- 1. 작품 구경 및 플레이 화면 -->
    <div id="playSection">
        <div id="playerArea" class="box hidden" style="margin-bottom: 20px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h2 id="nowPlayingTitle" style="margin:0; font-size:18px;">게임 제목</h2>
                <button onclick="closePlayer()" style="padding:6px 12px; cursor:pointer;">닫기 ✖</button>
            </div>
            <iframe id="gameFrame" sandbox="allow-scripts"></iframe>
        </div>

        <h2 style="font-size:18px; margin-bottom:12px;">🔥 인기 작품 목록 (클릭해서 실행)</h2>
        <div id="projectGrid" class="grid"></div>
    </div>

    <!-- 2. 작품 만들기 (코딩 & 테스트) 화면 -->
    <div id="makeSection" class="box hidden">
        <h2 style="margin-top:0; font-size:18px;">🛠️ 나만의 미니게임 만들기</h2>
        <p style="font-size:13px; color:#64748b;">아래 기본 코드를 수정하거나, AI에게 짜달라고 한 HTML 코드를 붙여넣고 실행해 보세요!</p>
        
        <input type="text" id="projTitle" placeholder="작품 제목 (예: 10초 광클 게임)">
        <input type="text" id="projAuthor" placeholder="제작자 이름 / 반 (예: 2학년 3반 김철수)">
        
        <textarea id="codeEditor"></textarea>
        
        <div style="display:flex; gap:8px; margin-bottom:16px;">
            <button class="action-btn" onclick="runPreview()">▶ 미리보기 실행</button>
            <button class="action-btn blue" onclick="publishProject()">📤 작품 올리기</button>
        </div>

        <h3 style="font-size:15px; margin-bottom:8px;">미리보기 화면</h3>
        <iframe id="previewFrame" sandbox="allow-scripts"></iframe>
    </div>
</div>

<!-- AADS 배너 광고 자리 -->
<div class="ad-container">
    <!-- 여기에 AADS에서 발급받은 iframe 배너 코드를 붙여넣으세요 -->
    [ AADS 광고 배너 자리 - 게임을 플레이하는 동안 자연스럽게 노출됩니다 ]
</div>

<script>
    // 기본 제공 스타터 템플릿 코드 (초보자용 예제)
    const starterCode = `<!DOCTYPE html>
<html>
<body style="text-align:center; font-family:sans-serif; padding-top:40px; background:#fefce8;">
  <h2>⚡ 10초 광클 챌린지!</h2>
  <p>버튼을 최대한 빠르게 눌러보세요!</p>
  <h1 id="score" style="font-size:48px; color:#ea580c;">0</h1>
  <button onclick="clickBtn()" style="font-size:20px; padding:15px 30px; border-radius:12px; background:#f97316; color:white; border:none; cursor:pointer;">클릭하기!</button>
  <script>
    let count = 0;
    function clickBtn() {
      count++;
      document.getElementById('score').innerText = count;
    }
  <\/script>
</body>
</html>`;

    // 기본 탑재 작품 목록
    const defaultProjects = [
        {
            title: "⚡ 10초 광클 챌린지",
            author: "운영자",
            code: starterCode
        },
        {
            title: "🎲 행운의 주사위 굴리기",
            author: "운영자",
            code: `<!DOCTYPE html><html><body style="text-align:center; padding-top:50px; font-family:sans-serif;"><h2>🎲 주사위 게임</h2><h1 id="dice" style="font-size:60px;">❓</h1><button onclick="roll()" style="padding:12px 24px; font-size:18px; cursor:pointer;">굴리기!</button><script>function roll(){ document.getElementById('dice').innerText = Math.floor(Math.random()*6)+1; }<\/script></body></html>`
        }
    ];

    let projects = JSON.parse(localStorage.getItem('miniEntryProjects')) || defaultProjects;

    // 탭 전환
    function switchTab(tab) {
        document.getElementById('playSection').classList.toggle('hidden', tab !== 'play');
        document.getElementById('makeSection').classList.toggle('hidden', tab !== 'make');
        document.getElementById('tabPlay').classList.toggle('active', tab === 'play');
        document.getElementById('tabMake').classList.toggle('active', tab === 'make');
        
        if (tab === 'make' && !document.getElementById('codeEditor').value) {
            document.getElementById('codeEditor').value = starterCode;
            runPreview();
        }
    }

    // 작품 목록 그리기
    function renderProjects() {
        const grid = document.getElementById('projectGrid');
        grid.innerHTML = '';
        projects.forEach((p, idx) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<h3>${p.title}</h3><p>제작자: ${p.author}</p>`;
            card.onclick = () => playProject(idx);
            grid.appendChild(card);
        });
    }

    // 작품 실행
    function playProject(idx) {
        const p = projects[idx];
        document.getElementById('playerArea').classList.remove('hidden');
        document.getElementById('nowPlayingTitle').innerText = `${p.title} (by ${p.author})`;
        document.getElementById('gameFrame').srcdoc = p.code;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePlayer() {
        document.getElementById('playerArea').classList.add('hidden');
        document.getElementById('gameFrame').srcdoc = '';
    }

    // 에디터 미리보기
    function runPreview() {
        const code = document.getElementById('codeEditor').value;
        document.getElementById('previewFrame').srcdoc = code;
    }

    // 작품 등록하기
    function publishProject() {
        const title = document.getElementById('projTitle').value.trim();
        const author = document.getElementById('projAuthor').value.trim() || '익명';
        const code = document.getElementById('codeEditor').value;

        if (!title) return alert('작품 제목을 입력해주세요!');
        
        projects.unshift({ title, author, code });
        localStorage.setItem('miniEntryProjects', JSON.stringify(projects));
        
        alert('작품이 등록되었습니다!');
        renderProjects();
        switchTab('play');
        playProject(0);
    }

    // 초기 실행
    renderProjects();
</script>

</body>
</html>
