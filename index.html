<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>왕좌의 게임 - 체류 시간 계급 시스템</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            margin-top: 20px;
        }
        h1 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 14px;
            margin-bottom: 25px;
        }
        /* 내 상태 카드 */
        .my-status {
            background: linear-gradient(135deg, #2a2a35, #1f1f28);
            border: 2px solid #444;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
        }
        .my-status.is-king {
            border-color: #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }
        .rank-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }
        .points-display {
            font-size: 28px;
            font-weight: 800;
            color: #4ade80;
            margin: 10px 0;
        }
        /* 랭킹 보드 */
        .ranking-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #262626;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 5px solid #555;
        }
        .user-item.king-row {
            border-left-color: #ffd700;
            background: #2d2a1e;
        }
        .user-item.me-row {
            border: 1px solid #4ade80;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-rank-tag {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
        }
        /* 왕 전용 컨트롤 */
        select {
            background: #333;
            color: white;
            border: 1px solid #ffd700;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        .king-notice {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
        }
        /* 계급별 색상 */
        .rank-왕 { background: #ffd700; color: #000; }
        .rank-공작 { background: #a855f7; color: #fff; }
        .rank-귀족 { background: #3b82f6; color: #fff; }
        .rank-기사 { background: #10b981; color: #fff; }
        .rank-평민 { background: #6b7280; color: #fff; }
        .rank-노예 { background: #ef4444; color: #fff; }
    </style>
</head>
<body>

    <!-- BEGIN AADS AD UNIT 2461733 -->
    <div id="frame" style="width: 100%;margin: auto;position: relative; z-index: 99998;">
        <iframe data-aa='2461733' src='//acceptable.a-ads.com/2461733/?size=Adaptive'
                style='border:0; padding:0; width:70%; height:auto; overflow:hidden;display: block;margin: auto'></iframe>
    </div>
    <!-- END AADS AD UNIT 2461733 -->

    <div class="container">
        <h1>👑 포인트 왕국</h1>
        <p class="subtitle">웹사이트에 오래 머무를수록 포인트가 쌓이고 계급이 오릅니다! (1초당 +10P)</p>

        <!-- 내 정보 표시 영역 -->
        <div class="my-status" id="myStatusBox">
            <div>나의 현재 계급</div>
            <div class="rank-badge rank-평민" id="myRankBadge">평민</div>
            <div class="points-display"><span id="myPoints">0</span> P</div>
            <div style="font-size: 13px; color: #888;" id="nextRankInfo">다음 계급(기사)까지 100 P 남음</div>
        </div>

        <!-- 왕이 되었을 때 나타나는 안내 문구 -->
        <div class="king-notice" id="kingNotice">
            👑 당신은 이 구역의 <strong>왕</strong>입니다! 아래 목록에서 다른 사람들의 계급을 마음대로 변경할 수 있습니다.
        </div>

        <!-- 전체 유저 랭킹 및 계급 관리 -->
        <h3>🏆 실시간 왕국 서열</h3>
        <ul class="ranking-list" id="rankingList"></ul>
    </div>

    <script>
        // 계급 기준표 (포인트에 따른 자동 승급)
        const RANKS = [
            { name: '노예', minPoints: -9999 },
            { name: '평민', minPoints: 0 },
            { name: '기사', minPoints: 100 },
            { name: '귀족', minPoints: 300 },
            { name: '공작', minPoints: 600 }
        ];

        // 유저 데이터 초기화 (로컬 스토리지에 내 포인트 저장)
        let savedMyPoints = parseInt(localStorage.getItem('myWebPoints')) || 0;

        let users = [
            { id: 'me', name: '나 (Me)', points: savedMyPoints, customRank: null, isMe: true },
            { id: 'bot1', name: '기존폭군', points: 450, customRank: null, isMe: false },
            { id: 'bot2', name: '시간부자', points: 250, customRank: null, isMe: false },
            { id: 'bot3', name: '잠수타는중', points: 120, customRank: null, isMe: false },
            { id: 'bot4', name: '뉴비123', points: 30, customRank: null, isMe: false }
        ];

        // 포인트 기준 자동 계급 계산 함수
        function getAutoRank(points) {
            let currentRank = '평민';
            for (let r of RANKS) {
                if (points >= r.minPoints) {
                    currentRank = r.name;
                }
            }
            return currentRank;
        }

        // 다음 계급까지 남은 포인트 계산
        function getNextRankText(points, isKing) {
            if (isKing) return "최고 권력자(왕) 자리에 올랐습니다!";
            for (let r of RANKS) {
                if (points < r.minPoints) {
                    return `다음 계급(${r.name})까지 ${r.minPoints - points} P 남음`;
                }
            }
            return "최고 계급 달성! 1위가 되어 왕좌를 차지하세요!";
        }

        // 왕이 다른 사람의 계급을 강제로 변경하는 함수
        function changeUserRank(userId, newRank) {
            const target = users.find(u => u.id === userId);
            if (target) {
                target.customRank = newRank === 'AUTO' ? null : newRank;
                render();
            }
        }

        // 화면 업데이트 함수
        function render() {
            // 1. 포인트 높은 순으로 정렬
            users.sort((a, b) => b.points - a.points);

            // 2. 1등이 왕이 됨
            const kingUser = users[0];
            const amIKing = kingUser.isMe;

            // 3. 내 상태 업데이트
            const me = users.find(u => u.isMe);
            let myFinalRank = amIKing ? '왕' : (me.customRank || getAutoRank(me.points));

            const myStatusBox = document.getElementById('myStatusBox');
            const myRankBadge = document.getElementById('myRankBadge');
            const kingNotice = document.getElementById('kingNotice');

            myRankBadge.textContent = myFinalRank;
            myRankBadge.className = `rank-badge rank-${myFinalRank}`;
            document.getElementById('myPoints').textContent = me.points.toLocaleString();
            document.getElementById('nextRankInfo').textContent = getNextRankText(me.points, amIKing);

            if (amIKing) {
                myStatusBox.classList.add('is-king');
                kingNotice.style.display = 'block';
            } else {
                myStatusBox.classList.remove('is-king');
                kingNotice.style.display = 'none';
            }

            // 4. 랭킹 리스트 렌더링
            const listEl = document.getElementById('rankingList');
            listEl.innerHTML = '';

            users.forEach((user, index) => {
                const isKing = (index === 0);
                // 왕이면 무조건 '왕', 아니면 왕이 지정한 계급 우선, 없으면 포인트 자동 계급
                const displayRank = isKing ? '왕' : (user.customRank || getAutoRank(user.points));

                const li = document.createElement('li');
                li.className = `user-item ${isKing ? 'king-row' : ''} ${user.isMe ? 'me-row' : ''}`;

                // 왕일 경우, 자신보다 낮은 계급(2위 이하)의 계급을 바꿀 수 있는 드롭다운 생성
                let kingControlHTML = '';
                if (amIKing && !isKing) {
                    kingControlHTML = `
                        <select onchange="changeUserRank('${user.id}', this.value)">
                            <option value="AUTO" ${!user.customRank ? 'selected' : ''}>자동(${getAutoRank(user.points)})</option>
                            <option value="공작" ${user.customRank === '공작' ? 'selected' : ''}>공작 임명</option>
                            <option value="귀족" ${user.customRank === '귀족' ? 'selected' : ''}>귀족 임명</option>
                            <option value="기사" ${user.customRank === '기사' ? 'selected' : ''}>기사 임명</option>
                            <option value="평민" ${user.customRank === '평민' ? 'selected' : ''}>평민 강등</option>
                            <option value="노예" ${user.customRank === '노예' ? 'selected' : ''}>노예 강등</option>
                        </select>
                    `;
                }

                li.innerHTML = `
                    <div class="user-info">
                        <strong>${index + 1}위</strong>
                        <span class="user-rank-tag rank-${displayRank}">${displayRank}</span>
                        <span>${user.name}</span>
                    </div>
