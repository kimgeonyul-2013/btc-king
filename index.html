<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비트코인 테스트넷 잔액 조회 & 수도꼭지</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #11131a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #1d202b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 500px;
        }
        h1 {
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 20px;
            color: #f7931a;
            text-align: center;
        }
        .select-group, .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: #a0a6b8;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #32374a;
            background-color: #13151d;
            color: #ffffff;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #6b4ce6;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #583bc9;
        }
        .result-box {
            margin-top: 20px;
            padding: 16px;
            background-color: #13151d;
            border-radius: 8px;
            border: 1px solid #2a2e3d;
            display: none;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }
        .result-row:last-child {
            margin-bottom: 0;
        }
        .highlight {
            color: #4cd964;
            font-weight: bold;
        }
        .faucet-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #2e3344;
        }
        .faucet-title {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #e2e8f0;
        }
        .faucet-links a {
            display: block;
            padding: 10px 14px;
            margin-bottom: 8px;
            background-color: #262a38;
            color: #60a5fa;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .faucet-links a:hover {
            background-color: #32374a;
        }
        .error {
            color: #ff5b5b;
            font-size: 0.9rem;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧪 비트코인 테스트넷 조회기</h1>
    
    <div class="select-group">
        <label for="network">테스트넷 네트워크 선택</label>
        <select id="network">
            <option value="testnet4">Testnet4 (최신 테스트넷)</option>
            <option value="testnet">Testnet3 (기존 테스트넷)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="address">테스트넷 지갑 주소 (m, n, 2, tb1 등으로 시작)</label>
        <input type="text" id="address" placeholder="예: tb1q... 또는 m... / n...">
    </div>

    <button onclick="checkBalance()">잔액 조회하기</button>
    <div id="errorMsg" class="error"></div>

    <div id="resultBox" class="result-box">
        <div class="result-row">
            <span>확인된 잔액:</span>
            <span id="confirmedBalance" class="highlight">0 BTC</span>
        </div>
        <div class="result-row">
            <span>대기 중 (미승인):</span>
            <span id="unconfirmedBalance">0 BTC</span>
        </div>
        <div class="result-row">
            <span>총 받은 코인:</span>
            <span id="totalReceived">0 BTC</span>
        </div>
    </div>

    <div class="faucet-section">
        <div class="faucet-title">🚰 무료 테스트넷 코인 받기 (수도꼭지)</div>
        <div class="faucet-links">
            <a href="https://mempool.space" target="_blank">1. Mempool 공식 Testnet4 수도꼭지 ↗</a>
            <a href="https://testnet4.dev" target="_blank">2. Testnet4.dev 수도꼭지 ↗</a>
            <a href="https://coinfaucet.eu" target="_blank">3. CoinFaucet (Testnet3) 수도꼭지 ↗</a>
            <a href="https://uo1.net" target="_blank">4. UO1.net (Testnet3) 수도꼭지 ↗</a>
        </div>
    </div>
</div>

<script>
    async function checkBalance() {
        const network = document.getElementById('network').value;
        const address = document.getElementById('address').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const resultBox = document.getElementById('resultBox');

        errorMsg.textContent = '';
        resultBox.style.display = 'none';

        if (!address) {
            errorMsg.textContent = '지갑 주소를 입력해 주세요.';
            return;
        }

        // 메인넷 주소(1 또는 3으로 시작) 입력 시 안내
        if (address.startsWith('1') || address.startsWith('3')) {
            errorMsg.textContent = '주의: 입력하신 주소는 테스트넷이 아닌 실제 비트코인(메인넷) 주소 형식입니다.';
            return;
        }

        try {
            const response = await fetch(`https://mempool.space{network}/api/address/${address}`);
            
            if (!response.ok) {
                throw new Error('올바르지 않은 테스트넷 주소이거나 네트워크 응답 오류가 발생했습니다.');
            }

            const data = await response.json();

            // 사토시(satoshi) 단위를 BTC 단위로 변환 (1 BTC = 100,000,000 satoshi)
            const confirmed = (data.chain_stats.funded_txo_sum - data.chain_stats.spent_txo_sum) / 100000000;
            const unconfirmed = (data.mempool_stats.funded_txo_sum - data.mempool_stats.spent_txo_sum) / 100000000;
            const totalReceived = data.chain_stats.funded_txo_sum / 100000000;

            document.getElementById('confirmedBalance').textContent = confirmed.toFixed(8) + ' tBTC';
            document.getElementById('unconfirmedBalance').textContent = (unconfirmed >= 0 ? '+' : '') + unconfirmed.toFixed(8) + ' tBTC';
            document.getElementById('totalReceived').textContent = totalReceived.toFixed(8) + ' tBTC';

            resultBox.style.display = 'block';
        } catch (err) {
            errorMsg.textContent = err.message;
        }
    }
</script>

</body>
</html>
