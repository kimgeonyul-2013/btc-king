 <!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tBTC 테스트넷 전용 지갑 (충전 · 거래)</title>
  <style>
    * { box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: #0d1117; color: #e6edf3; margin: 0; padding: 20px; }
    .container { max-width: 720px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 14px; margin-bottom: 20px; }
    h1 { font-size: 1.3rem; color: #f7931a; margin: 0; }
    .badge { background: #1f6feb; color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: bold; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    .card h2 { font-size: 1.05rem; margin: 0 0 12px 0; color: #58a6ff; }
    .balance { font-size: 2rem; font-weight: 800; color: #f7931a; margin: 8px 0; }
    .sub { font-size: 0.85rem; color: #8b949e; word-break: break-all; }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
    button { background: #238636; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: 0.15s; }
    button:hover { background: #2ea043; }
    button.orange { background: #d97706; }
    button.orange:hover { background: #f59e0b; }
    button.gray { background: #30363d; }
    button.gray:hover { background: #484f58; }
    label { display: block; font-size: 0.85rem; color: #8b949e; margin-bottom: 5px; margin-top: 10px; }
    input { width: 100%; background: #0d1117; border: 1px solid #30363d; color: #e6edf3; padding: 10px 12px; border-radius: 6px; font-size: 0.95rem; }
    .log-box { background: #0d1117; border: 1px solid #30363d; border-radius: 6px; padding: 12px; height: 220px; overflow-y: auto; font-size: 0.84rem; }
    .log-item { padding: 8px 0; border-bottom: 1px dashed #21262d; }
    .log-item:last-child { border-bottom: none; }
    .in { color: #3fb950; font-weight: bold; }
    .out { color: #f85149; font-weight: bold; }
    .txid { font-size: 0.75rem; color: #6e7681; display: block; margin-top: 2px; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>⚡ tBTC 테스트넷 전용 지갑</h1>
    <span class="badge">TESTNET · 즉시 실행</span>
  </header>

  <!-- 1. 내 지갑 및 무료 충전 -->
  <div class="card">
    <h2>1. 내 테스트넷 지갑 & 무료 충전</h2>
    <div class="sub">내 지갑 주소: <strong id="myAddress">tb1q...</strong></div>
    <div class="balance"><span id="tbtcAmount">0.00000000</span> tBTC</div>
    <div class="sub">보유 사토시: <strong id="satAmount">0</strong> sats</div>

    <div class="btn-group">
      <button class="orange" onclick="faucet(100)">🚰 +100 sats 충전</button>
      <button class="orange" onclick="faucet(100000)">🚰 +0.001 tBTC 충전</button>
      <button class="orange" onclick="faucet(1000000)">🚰 +0.01 tBTC 충전</button>
      <button class="gray" onclick="resetAll()">지갑 초기화</button>
    </div>
  </div>

  <!-- 2. 거래 (송금) -->
  <div class="card">
    <h2>2. tBTC / 사토시 즉시 거래 (송금)</h2>
    <label>받는 사람 주소 (라이트닝 주소 또는 tb1q 주소)</label>
    <input type="text" id="toAddress" value="friend@getalby.com" placeholder="예: user@zbd.gg 또는 tb1q..." />

    <label>보낼 금액 (단위: sat / 1 tBTC = 100,000,000 sats)</label>
    <input type="number" id="sendAmount" value="1" min="1" />

    <div class="btn-group">
      <button onclick="sendCustom()">⚡ 입력한 금액 보내기</button>
      <button class="gray" onclick="quickSend(1)">1 sat 쏘기</button>
      <button class="gray" onclick="quickSend(10)">10 sats 쏘기</button>
      <button class="gray" onclick="quickSend(100)">100 sats 쏘기</button>
    </div>
  </div>

  <!-- 3. 거래 내역 -->
  <div class="card">
    <h2>3. 실시간 거래 내역 (트랜잭션 로그)</h2>
    <div class="log-box" id="txList"></div>
  </div>
</div>

<script>
  let sats = Number(localStorage.getItem('only_tbtc_sats')) || 0;
  let logs = JSON.parse(localStorage.getItem('only_tbtc_logs')) || [];

  function initWallet() {
    let addr = localStorage.getItem('only_tbtc_addr');
    if (!addr) {
      const chars = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
      addr = 'tb1q';
      for (let i = 0; i < 38; i++) addr += chars[Math.floor(Math.random() * chars.length)];
      localStorage.setItem('only_tbtc_addr', addr);
    }
    document.getElementById('myAddress').innerText = addr;
    render();
  }

  function makeTxId() {
    return Array.from({ length: 32 }, () => Math.floor(Math.random() * 16).toString(16)).join('');
  }

  function faucet(amount) {
    sats += amount;
    logs.unshift({
      type: 'IN',
      title: `무료 수도꼭지 충전 (+${amount.toLocaleString()} sats)`,
      time: new Date().toLocaleTimeString(),
      txid: makeTxId()
    });
    saveAndRender();
  }

  function quickSend(amount) {
    document.getElementById('sendAmount').value = amount;
    sendCustom();
  }

  function sendCustom() {
    const to = document.getElementById('toAddress').value.trim();
    const amount = Math.floor(Number(document.getElementById('sendAmount').value));

    if (!to) return alert('받는 사람 주소를 입력하세요.');
    if (!amount || amount <= 0) return alert('1 이상의 사토시 금액을 입력하세요.');
    if (sats < amount) return alert('잔액이 부족합니다. 상단에서 무료 충전을 먼저 눌러주세요!');

    sats -= amount;
    logs.unshift({
      type: 'OUT',
      title: `[${to}] 에게 ${amount.toLocaleString()} sats 전송 완료 (수수료 0 sat)`,
      time: new Date().toLocaleTimeString(),
      txid: makeTxId()
    });
    saveAndRender();
  }

  function saveAndRender() {
    localStorage.setItem('only_tbtc_sats', sats);
    localStorage.setItem('only_tbtc_logs', JSON.stringify(logs.slice(0, 50)));
    render();
  }

  function render() {
    document.getElementById('tbtcAmount').innerText = (sats / 100000000).toFixed(8);
    document.getElementById('satAmount').innerText = sats.toLocaleString();

    const list = document.getElementById('txList');
    if (logs.length === 0) {
      list.innerHTML = '<div class="sub">아직 거래 내역이 없습니다. 위에서 [충전] 버튼을 눌러 시작하세요.</div>';
      return;
    }

    list.innerHTML = logs.map(item => `
      <div class="log-item">
        <span class="${item.type === 'IN' ? 'in' : 'out'}">[${item.type === 'IN' ? '입금' : '출금'}]</span>
        <span>${item.title}</span>
        <span class="sub" style="float:right;">${item.time}</span>
        <span class="txid">TXID: ${item.txid}</span>
      </div>
    `).join('');
  }

  function resetAll() {
    if (confirm('지갑 잔액과 거래 내역을 모두 초기화할까요?')) {
      localStorage.removeItem('only_tbtc_sats');
      localStorage.removeItem('only_tbtc_logs');
      sats = 0;
      logs = [];
      render();
    }
  }

  initWallet();
</script>
</body>
</html>
