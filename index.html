<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비트코인 테스트넷 조회기</title>
    <style>
        * {
            box-sizing: border-box;
            border-radius: 0 !important;
        }
        body {
            font-family: "Courier New", Courier, monospace, -apple-system, sans-serif;
            background-color: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #000000;
            padding: 24px;
            border: 2px solid #ffffff;
            width: 100%;
            max-width: 500px;
        }
        h1 {
            font-size: 1.25rem;
            margin: 0 0 20px 0;
            padding-bottom: 12px;
            border-bottom: 2px solid #ffffff;
            color: #ffffff;
            text-align: left;
            letter-spacing: -0.5px;
        }
        .select-group, .input-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #ffffff;
            font-weight: bold;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ffffff;
            background-color: #000000;
            color: #ffffff;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
        }
        select:focus, input:focus {
            border: 2px solid #ffffff;
            padding: 11px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: 2px solid #ffffff;
            background-color: #ffffff;
            color: #000000;
            font-size: 1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
        }
        button:hover {
            background-color: #000000;
            color: #ffffff;
        }
        button:disabled {
            background-color: #000000;
            color: #ffffff;
            border-style: dashed;
            cursor: not-allowed;
        }
        .result-box {
            margin-top: 20px;
            padding: 16px;
            background-color: #000000;
            border: 1px solid #ffffff;
            display: none;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.95rem;
            border-bottom: 1px solid #ffffff;
            padding-bottom: 6px;
        }
        .result-row:last-child {
            margin-bottom: 0;
            border-bottom: none;
            padding-bottom: 0;
        }
        .highlight {
            font-weight: bold;
            text-decoration: underline;
        }
        .faucet-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 2px solid #ffffff;
        }
        .faucet-title {
            font-size: 0.95rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .faucet-links a {
            display: block;
            padding: 10px 12px;
            margin-bottom: 8px;
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .faucet-links a:hover {
            background-color: #ffffff;
            color: #000000;
            font-weight: bold;
        }
        .error {
            color: #ffffff;
            background-color: #000000;
            border: 1px solid #ffffff;
            padding: 10px;
            font-size: 0.9rem;
            margin-top: 12px;
            text-align: center;
            display: none;
        }
        .error:not(:empty) {
            display: block;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>[ BITCOIN TESTNET EXPLORER ]</h1>
    
    <div class="select-group">
        <label for="network">NETWORK / 네트워크 선택</label>
        <select id="network">
            <option value="testnet4">Testnet4 (최신 테스트넷)</option>
            <option value="testnet">Testnet3 (기존 테스트넷)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="address">ADDRESS / 테스트넷 지갑 주소 (m, n, 2, tb1)</label>
        <input type="text" id="address" placeholder="tb1q... / m... / n...">
    </div>

    <button id="checkBtn" onclick="checkBalance()">잔액 조회하기</button>
    <div id="errorMsg" class="error"></div>

    <div id="resultBox" class="result-box">
        <div class="result-row">
            <span>확인된 잔액:</span>
            <span id="confirmedBalance" class="highlight">0 tBTC</span>
        </div>
        <div class="result-row">
            <span>대기 중 (미승인):</span>
            <span id="unconfirmedBalance">0 tBTC</span>
        </div>
        <div class="result-row">
            <span>총 받은 코인:</span>
            <span id="totalReceived">0 tBTC</span>
        </div>
    </div>

    <div class="faucet-section">
        <div class="faucet-title">[ FAUCET / 무료 테스트넷 코인 받기 ]</div>
        <div class="faucet-links">
            <a href="https://mempool.space" target="_blank" rel="noopener noreferrer">1. Mempool 공식 Testnet4 수도꼭지 ↗</a>
            <a href="https://coinfaucet.eu" target="_blank" rel="noopener noreferrer">2. CoinFaucet (Testnet4) 수도꼭지 ↗</a>
            <a href="https://coinfaucet.eu" target="_blank" rel="noopener noreferrer">3. CoinFaucet (Testnet3) 수도꼭지 ↗</a>
            <a href="https://uo1.net" target="_blank" rel="noopener noreferrer">4. UO1.net (Testnet3) 수도꼭지 ↗</a>
        </div>
    </div>
</div>

<script>
    async function checkBalance() {
        const network = document.getElementById('network').value;
        const address = document.getElementById('address').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const resultBox = document.getElementById('resultBox');
        const checkBtn = document.getElementById('checkBtn');

        errorMsg.textContent = '';
        resultBox.style.display = 'none';

        if (!address) {
            errorMsg.textContent = '[ERROR] 지갑 주소를 입력해 주세요.';
            return;
        }

        if (address.startsWith('1') || address.startsWith('3') || address.startsWith('bc1')) {
            errorMsg.textContent = '[WARNING] 테스트넷이 아닌 실제 비트코인(메인넷) 주소입니다.';
            return;
        }

        checkBtn.disabled = true;
        checkBtn.textContent = '조회 중...';

        try {
            const response = await fetch(`https://mempool.space{network}/api/address/${address}`);
            
            if (!response.ok) {
                throw new Error('[ERROR] 올바르지 않은 테스트넷 주소이거나 네트워크 응답 오류입니다.');
            }

            const data = await response.json();

            const confirmed = (data.chain_stats.funded_txo_sum - data.chain_stats.spent_txo_sum) / 100000000;
            const unconfirmed = (data.mempool_stats.funded_txo_sum - data.mempool_stats.spent_txo_sum) / 100000000;
            const totalReceived = data.chain_stats.funded_txo_sum / 100000000;

            document.getElementById('confirmedBalance').textContent = confirmed.toFixed(8) + ' tBTC';
            document.getElementById('unconfirmedBalance').textContent = (unconfirmed >= 0 ? '+' : '') + unconfirmed.toFixed(8) + ' tBTC';
            document.getElementById('totalReceived').textContent = totalReceived.toFixed(8) + ' tBTC';

            resultBox.style.display = 'block';
        } catch (err) {
            errorMsg.textContent = err.message;
        } finally {
            checkBtn.disabled = false;
            checkBtn.textContent = '잔액 조회하기';
        }
    }

    document.getElementById('address').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            checkBalance();
        }
    });
</script>

</body>
</html>
