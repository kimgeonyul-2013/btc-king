<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🗣️ 비명 질러 점프! - 목소리 조종 게임</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; user-select: none; }
        body {
            margin: 0; background: #0f172a; color: white;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 16px;
        }
        h1 { font-size: 22px; margin: 8px 0; text-align: center; color: #38bdf8; }
        p.sub { font-size: 13px; color: #94a3b8; margin: 0 0 16px 0; text-align: center; }

        .game-wrapper {
            width: 100%; max-width: 480px; background: #1e293b;
            border-radius: 16px; padding: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .score-board {
            display: flex; justify-content: space-between; font-size: 16px;
            font-weight: bold; margin-bottom: 10px; color: #f8fafc;
        }
        canvas {
            width: 100%; height: 260px; background: linear-gradient(to bottom, #38bdf8, #bae6fd);
            border-radius: 12px; display: block;
        }

        /* 마이크 볼륨 게이지 바 */
        .mic-box { margin-top: 14px; }
        .mic-label { display: flex; justify-content: space-between; font-size: 12px; color: #cbd5e1; margin-bottom: 4px; }
        .bar-bg { width: 100%; height: 14px; background: #334155; border-radius: 7px; overflow: hidden; }
        .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #22c55e, #eab308, #ef4444); transition: width 0.05s; }

        /* 감도 조절 슬라이더 (교실 소음에 맞게 조절) */
        .sensitivity { margin-top: 12px; display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: #cbd5e1; }
        input[type=range] { width: 60%; }

        .btn {
            width: 100%; margin-top: 16px; padding: 14px; border: none; border-radius: 10px;
            background: #2563eb; color: white; font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .btn:hover { background: #1d4ed8; }
        .btn:disabled { background: #475569; cursor: not-allowed; }

        /* AADS 배너 광고 영역 */
        .ad-container {
            width: 100%; max-width: 480px; margin-top: 20px; padding: 14px;
            background: #1e293b; border-radius: 12px; text-align: center;
            border: 1px dashed #475569; font-size: 12px; color: #94a3b8;
        }
    </style>
</head>
<body>

    <h1>🗣️ 비명 질러 점프!</h1>
    <p class="sub">작게 말하면 전진! 크게 소리 지르면 점프!</p>

    <div class="game-wrapper">
        <div class="score-board">
            <span>점수: <span id="score">0</span>m</span>
            <span>최고기록: <span id="bestScore">0</span>m</span>
        </div>

        <canvas id="gameCanvas" width="480" height="260"></canvas>

        <!-- 실시간 마이크 소리 크기 게이지 -->
        <div class="mic-box">
            <div class="mic-label">
                <span>🎤 마이크 입력 크기</span>
                <span id="volText">0%</span>
            </div>
            <div class="bar-bg">
                <div id="volBar" class="bar-fill"></div>
            </div>
        </div>

        <!-- 주변 소음에 맞춘 마이크 감도 조절 -->
        <div class="sensitivity">
            <span>🎚️ 마이크 감도</span>
            <input type="range" id="sensSlider" min="1" max="5" step="0.5" value="2.5">
        </div>

        <button id="startBtn" class="btn" onclick="startGame()">🎤 마이크 켜고 게임 시작!</button>
    </div>

    <!-- AADS 광고 배너 넣는 자리 -->
    <div class="ad-container">
        <!-- 여기에 AADS에서 발급받은 iframe 배너 코드를 붙여넣으세요 -->
        [ AADS 광고 배너 자리 ]
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    let audioCtx, analyser, microphone, dataArray;
    let isPlaying = false;
    let score = 0;
    let bestScore = localStorage.getItem("screamBest") || 0;
    document.getElementById("bestScore").innerText = bestScore;

    // 플레이어 설정
    const player = { x: 60, y: 190, size: 32, dy: 0, gravity: 0.6, grounded: true };
    let obstacles = [];
    let frameCount = 0;

    // 마이크 연결 및 게임 시작
    async function startGame() {
        try {
            if (!audioCtx) {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                microphone = audioCtx.createMediaStreamSource(stream);
                analyser.fftSize = 256;
                microphone.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if (audioCtx.state === "suspended") await audioCtx.resume();

            // 초기화
            player.y = 190;
            player.dy = 0;
            obstacles = [];
            score = 0;
            frameCount = 0;
            isPlaying = true;
            document.getElementById("startBtn").disabled = true;
            document.getElementById("startBtn").innerText = "🔥 소리 내서 장애물을 피하세요!";
            
            gameLoop();
        } catch (err) {
            alert("마이크 권한을 허용해야 게임을 할 수 있습니다! (반드시 HTTPS 주소에서 실행해야 합니다)");
        }
    }

    // 현재 마이크 볼륨 계산 (0 ~ 100)
    function getVolume() {
        if (!analyser) return 0;
        analyser.getByteFrequencyData(dataArray);
        let sum = 0;
        for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
        const avg = sum / dataArray.length;
        const sens = parseFloat(document.getElementById("sensSlider").value);
        return Math.min(100, Math.round(avg * sens));
    }

    function gameLoop() {
        if (!isPlaying) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 바닥 그리기
        ctx.fillStyle = "#16a34a";
        ctx.fillRect(0, 222, canvas.width, 38);

        // 볼륨 측정 및 게이지 업데이트
        const vol = getVolume();
        document.getElementById("volBar").style.width = vol + "%";
        document.getElementById("volText").innerText = vol + "%";

        // 1. 소리가 일정 이상이면 전진 (점수 증가 & 장애물 이동)
        let speed = 0;
        if (vol > 10) {
            speed = 3 + (vol / 25);
            score += 0.1;
            document.getElementById("score").innerText = Math.floor(score);
        }

        // 2. 큰 소리를 내면 점프!
        if (vol > 45 && player.grounded) {
            player.dy = -13 - (vol / 20);
            player.grounded = false;
        }

        // 중력 적용
        player.y += player.dy;
        if (player.y + player.size < 222) {
            player.dy += player.gravity;
        } else {
            player.y = 222 - player.size;
            player.dy = 0;
            player.grounded = true;
        }

        // 캐릭터 그리기 (귀여운 이모지 캐릭터)
        ctx.font = "30px Arial";
        ctx.fillText(vol > 45 ? "😱" : (vol > 10 ? "🏃" : "😐"), player.x, player.y + 28);

        // 장애물 생성 (움직일 때만 생성)
        if (speed > 0) {
            frameCount++;
            if (frameCount % 95 === 0) {
                const height = 25 + Math.random() * 25;
                obstacles.push({ x: canvas.width, y: 222 - height, w: 22, h: height });
            }
        }

        // 장애물 이동 및 충돌 체크
        ctx.fillStyle = "#ef4444";
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= speed;
            ctx.fillRect(obs.x, obs.y, obs.w, obs.h);

            // 충돌 판정
            if (
                player.x + 6 < obs.x + obs.w &&
                player.x + player.size - 6 > obs.x &&
                player.y + 6 < obs.y + obs.h &&
                player.y + player.size > obs.y
            ) {
                gameOver();
                return;
            }

            if (obs.x + obs.w < 0) obstacles.splice(i, 1);
        }

        requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        isPlaying = false;
        const finalScore = Math.floor(score);
        if (finalScore > bestScore) {
            bestScore = finalScore;
            localStorage.setItem("screamBest", bestScore);
            document.getElementById("bestScore").innerText = bestScore;
        }
        document.getElementById("startBtn").disabled = false;
        document.getElementById("startBtn").innerText = `💥 게임 오버! (${finalScore}m) - 다시 하기`;
    }
</script>
</body>
</html>
